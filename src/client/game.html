<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="game.css" />
    <title>The Chain</title>
  </head>

  <body>
    <!-- The kindling screen: paints the festival night INSTANTLY (pure CSS) while
         Phaser + fonts boot, so the platform's loader hands off to our world, not
         a blank page. game.ts removes it when the scene is ready. -->
    <div id="kindling">
      <div class="k-lantern">
        <div class="k-paper"></div>
        <div class="k-cap"></div>
        <div class="k-base"></div>
        <div class="k-tassel"></div>
      </div>
      <p class="k-line">lighting the lanterns&hellip;</p>
    </div>
    <div id="app">
      <div id="game-container"></div>
    </div>
    <script type="module" src="game.ts"></script>
  </body>
</html>
