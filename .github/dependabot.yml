# Dependabot configuration — monthly, quiet. (Was twice-weekly; nine PRs landed
# on day one of the public repo, two days before the hackathon deadline.)
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Location of your package.json and package-lock.json
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # never propose compiler/platform majors unattended
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "devvit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@devvit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "phaser"
        update-types: ["version-update:semver-major"]
    groups:
      devvit:
        patterns:
          - "devvit"
          - "@devvit/*"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
